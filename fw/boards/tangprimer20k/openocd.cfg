# OpenOCD: отладка askoRV32 на Tang Primer 20K через программатор платы Dock
# (BL616 «FactoryAIOT Pro JTAG Debugger» эмулирует FT2232, интерфейс 0 - JTAG ПЛИС, интерфейс 1 - UART). Модуль отладки - hw/src/debug, описание -
# hw/info/debug.md.
#
# Запуск:            openocd -f fw/boards/tangprimer20k/openocd.cfg
# (Eclipse: запуск «riscv Debug OpenOCD» берёт fw/boards/<активная конфигурация сборки>/openocd.cfg)
# Проверка JTAG без ядра (первый запуск на плате, см. hw/info/debug.md):
#   openocd -c "set JTAG_ONLY 1" -f fw/boards/tangprimer20k/openocd.cfg -c "init; irscan gw2a18.cpu 0x42; echo [drscan gw2a18.cpu 32 0]; shutdown"
#   ожидается 00001071 (регистр dtmcs)

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b

# Несколько плат на одном ПК: программаторы Tang Nano 9K и Tang Primer 20K для ПК одинаковые (0403:6010,
# одно имя и серийный номер), поэтому свой программатор находит sw/fpgaload/boardsel.py - по IDCODE ПЛИС
# платы (.gwsoc рядом с этим файлом). Программатор один - выбирать нечего, строка пустая. Номер процесса
# OpenOCD записывается в %TEMP%/askorv32_openocd_<порт>.pid: по нему fpgaload.py видит, что программатор
# именно этой платы занят отладкой (с другой платой в это время работать можно). Нужен Python (команда py).
set _brd_dir [file dirname [file normalize [info script]]]
set _brd_gwsoc [lindex [glob -nocomplain -directory $_brd_dir *.gwsoc] 0]
if {[catch {exec py -u [file join $_brd_dir .. .. .. sw fpgaload boardsel.py] --gwsoc $_brd_gwsoc --openocd} _brd_sel]} {
    error "Выбор программатора платы: $_brd_sel"
}
if {$_brd_sel ne ""} { eval $_brd_sel }
set _brd_loc [expr {$_brd_sel eq "" ? "single" : [lindex $_brd_sel end]}]
catch {
    set _brd_f [open [file join $::env(TEMP) "askorv32_openocd_[string map {- _ . _} $_brd_loc].pid"] w]
    puts $_brd_f [pid]
    close $_brd_f
}
transport select jtag
# Сигналы JTAG выбираются тактом 27 МГц внутри ПЛИС: TCK не выше ~2 МГц
adapter speed 1000
# Выводов сброса нет: OpenOCD сбрасывает ядро и периферию через ndmreset модуля отладки
reset_config none

# TAP ПЛИС GW2A-18C: IR 8 бит (IDCODE 0x0000081b, проверено 2026-10-02). Регистры отладки RISC-V - пользовательские регистры GOWIN ER1/ER2
jtag newtap gw2a18 cpu -irlen 8 -expected-id 0x0000081b

if {![info exists JTAG_ONLY]} {
    target create gw2a18.cpu riscv -chain-position gw2a18.cpu
    riscv set_ir dtmcs 0x42
    riscv set_ir dmi 0x43
    # После загрузки ПЛИС по JTAG (openFPGALoader) первое чтение dtmcs даёт 0, и OpenOCD принимает
    # DTM за версию 0.11. Пустое чтение dtmcs перед опросом ядра это обходит (hw/info/debug.md)
    gw2a18.cpu configure -event examine-start {irscan gw2a18.cpu 0x42; drscan gw2a18.cpu 32 0}
    # Конец отладки (GDB отключился, в Eclipse - Terminate): программа продолжает работу. Без этого
    # OpenOCD 0.12 оставляет ядро остановленным, и программа стоит до сброса или выключения питания
    gw2a18.cpu configure -event gdb-detach {
        if {[gw2a18.cpu curstate] eq "halted"} { resume }
    }
    # Память - только через System Bus Access (буфера программ в модуле отладки нет)
    riscv set_mem_access sysbus
    gdb report_data_abort enable
}
